<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Practice — AZ NES Cert Prep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="index.html">AZ NES <span>Cert Prep</span></a>
      <a href="index.html">Dashboard</a>
      <a href="learn.html">Learn</a>
      <a href="study-guides.html">Guides</a>
      <a class="active" href="practice.html">Practice</a>
      <a href="exam.html">Exams</a>
      <a href="ace.html">Ace</a>
      <a href="notes.html">Notes</a>
      <a href="formulas.html">Formulas</a>
      <a href="cards.html">Cards</a>
      <a href="traps.html">Traps</a>
      <a href="plan.html">Mastery Plan</a>
    </nav>
  </header>

  <main class="wrap">
    <div class="eyebrow">NeetCode-style problem bank</div>
    <h1 style="font-family:var(--font-display);letter-spacing:-0.03em;margin-top:0">Practice problems</h1>
    <p class="muted" id="practice-hint">Filter by subject first, then domain. Math and English stay on separate tracks.</p>

    <div class="layout-split" style="margin-top:1rem">
      <section class="card">
        <div class="filters">
          <select id="track">
            <option value="all">All subjects</option>
            <option value="math">Mathematics (304)</option>
            <option value="english">English Language Arts (301)</option>
            <option value="pedagogy">APK Secondary (052)</option>
          </select>
          <select id="domain">
            <option value="all">All domains</option>
          </select>
          <select id="diff">
            <option value="all">All difficulties</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
          <select id="skill">
            <option value="all">All skills</option>
          </select>
          <select id="status">
            <option value="all">All statuses</option>
            <option value="todo">Not solved</option>
            <option value="missed">Missed on last exam</option>
            <option value="solved">Solved</option>
          </select>
          <input id="q" type="search" placeholder="Search title or tag…" style="min-width:180px;flex:1" />
        </div>
        <div class="table-wrap">
          <table class="problems">
            <thead>
              <tr><th>Status</th><th>ID</th><th>Title</th><th>Domain</th><th>Difficulty</th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>

      <section class="card" id="panel">
        <p class="muted">Select a problem to begin.</p>
      </section>
    </div>
  </main>

  <script src="js/data/curriculum.js"></script>
  <script src="js/data/skills.js"></script>
  <script src="js/data/problems.js"></script>
  <script src="js/data/problems-extra.js"></script>
  <script src="js/data/problems-foundations.js"></script>
  <script src="js/data/problems-mastery.js"></script>
  <script src="js/data/problems-english-foundations.js"></script>
  <script src="js/data/problems-english-reading.js"></script>
  <script src="js/data/problems-english-literature.js"></script>
  <script src="js/data/problems-english-language.js"></script>
  <script src="js/data/problems-english-writing.js"></script>
  <script src="js/data/problems-english-oral.js"></script>
  <script src="js/data/problems-exam-drill.js"></script>
  <script src="js/data/problems-ela-longform.js"></script>
  <script src="js/data/problems-ela-longform-b.js"></script>
  <script src="js/data/problems-ela-longform-c.js"></script>
  <script src="js/data/problems-ela-longform-d.js"></script>
  <script src="js/data/problems-ela-longform-e.js"></script>
  <script src="js/data/problems-ela-longform-f.js"></script>
  <script src="js/data/problems-ela-gaps.js"></script>
  <script src="js/data/problem-skills.js"></script>
  <script src="js/quiz-core.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/progress-engine.js"></script>
  <script src="js/vault-sync.js"></script>
  <script>
    const domainSelect = document.getElementById("domain");
    const skillSelect = document.getElementById("skill");
    const trackSelect = document.getElementById("track");
    const lastRepair = Progress.load().lastExamRepair || {};

    function fillDomainAndSkillOptions(track, selectedDomain, selectedSkill) {
      const domains = CURRICULUM.domains.filter(d => track === "all" || (d.track || "math") === track);
      domainSelect.innerHTML = `<option value="all">All domains</option>` + domains.map(d =>
        `<option value="${d.id}">${d.title}</option>`
      ).join("");
      const skills = Object.entries(SKILLS).filter(([, skill]) =>
        track === "all" || ProgressEngine.trackForDomain(skill.domain) === track
      ).sort((a, b) => a[1].title.localeCompare(b[1].title));
      skillSelect.innerHTML = `<option value="all">All skills</option>` + skills.map(([id, skill]) =>
        `<option value="${id}">${skill.title}</option>`
      ).join("");
      if (selectedDomain && [...domainSelect.options].some(o => o.value === selectedDomain)) {
        domainSelect.value = selectedDomain;
      }
      if (selectedSkill && [...skillSelect.options].some(o => o.value === selectedSkill)) {
        skillSelect.value = selectedSkill;
      }
    }

    const params = new URLSearchParams(location.search);
    if (params.get("missed") === "1") {
      trackSelect.value = lastRepair.track || "all";
      document.getElementById("status").value = "missed";
    } else {
      if (params.get("track")) trackSelect.value = params.get("track");
      if (params.get("status")) document.getElementById("status").value = params.get("status");
    }
    fillDomainAndSkillOptions(trackSelect.value, params.get("domain"), params.get("skill"));

    let activeId = params.get("id");

    function statusOf(id) {
      const p = Progress.load().problems[id];
      if (p?.correct) return "solved";
      if (p) return "attempted";
      return "todo";
    }

    function filtered() {
      const track = trackSelect.value;
      const d = domainSelect.value;
      const diff = document.getElementById("diff").value;
      const skill = skillSelect.value;
      const st = document.getElementById("status").value;
      const q = document.getElementById("q").value.trim().toLowerCase();
      const missedIds = new Set(lastRepair.missedIds || []);
      return PROBLEMS.filter(p => {
        const pTrack = ProgressEngine.trackForDomain(p.domain);
        if (track !== "all" && pTrack !== track) return false;
        if (d !== "all" && p.domain !== d) return false;
        if (diff !== "all" && p.difficulty !== diff) return false;
        if (skill !== "all" && !(p.skillIds || []).includes(skill)) return false;
        const s = statusOf(p.id);
        if (st === "todo" && s === "solved") return false;
        if (st === "solved" && s !== "solved") return false;
        if (st === "missed" && !missedIds.has(p.id)) return false;
        if (q && !(p.title.toLowerCase().includes(q) || p.id.toLowerCase().includes(q) || (p.tags || []).some(t => t.includes(q)))) return false;
        return true;
      });
    }

    function renderRows() {
      const rows = filtered();
      document.getElementById("rows").innerHTML = rows.map(p => {
        const s = statusOf(p.id);
        return `<tr data-id="${p.id}" style="cursor:pointer">
          <td><span class="chip ${s === "solved" ? "done" : ""}">${s}</span></td>
          <td><a href="?id=${p.id}">${p.id}</a></td>
          <td>${p.title}</td>
          <td>${CURRICULUM.domains.find(x => x.id === p.domain)?.title || p.domain}</td>
          <td><span class="chip ${p.difficulty}">${p.difficulty}</span></td>
        </tr>`;
      }).join("") || `<tr><td colspan="5" class="muted">No problems match.</td></tr>`;

      document.querySelectorAll("#rows tr[data-id]").forEach(tr => {
        tr.addEventListener("click", () => {
          activeId = tr.dataset.id;
          history.replaceState(null, "", `?id=${activeId}`);
          renderPanel();
          renderRows();
        });
      });
    }

    function renderPanel() {
      const panel = document.getElementById("panel");
      const p = PROBLEMS.find(x => x.id === activeId);
      if (!p) {
        panel.innerHTML = `<p class="muted">Select a problem to begin.</p>`;
        return;
      }
      const optionOrder = QuizCore.shuffleOptionIds(p, p.id);
      const explanation = QuizCore.renderExplanation(p.explanation, optionOrder);
      panel.innerHTML = `
        <div class="tag-row" style="margin-bottom:0.5rem">
          <span class="chip">${p.id}</span>
          <span class="chip ${p.difficulty}">${p.difficulty}</span>
          ${p.tags.map(t => `<span class="chip">${t}</span>`).join("")}
          ${(p.skillIds || []).map(skillId => `<span class="chip">${SKILLS[skillId]?.title || skillId}</span>`).join("")}
        </div>
        <h2 style="margin-top:0">${p.title}</h2>
        ${typeof stemHtml === "function" ? stemHtml(p) : `<div class="problem-stem">${p.stem}</div>`}
        <div class="choices" id="choices">
          ${optionOrder.map((optionId, displayIndex) => `
            <label class="choice" data-id="${optionId}">
              <input type="radio" name="ans" value="${optionId}" />
              <span><strong>${QuizCore.letterAt(displayIndex)}.</strong> ${QuizCore.findOption(p, optionId).text}</span>
            </label>`).join("")}
        </div>
        <div class="cta-row">
          <button class="btn btn-primary" id="check">Check answer</button>
          <button class="btn btn-ghost" id="reveal">Show explanation</button>
        </div>
        <div id="result"></div>
      `;

      const choices = [...document.querySelectorAll(".choice")];
      choices.forEach(ch => ch.addEventListener("click", () => {
        choices.forEach(x => x.classList.remove("selected"));
        ch.classList.add("selected");
        ch.querySelector("input").checked = true;
      }));

      document.getElementById("check").onclick = () => {
        const selected = document.querySelector("input[name=ans]:checked");
        if (!selected) {
          document.getElementById("result").innerHTML = `<p class="muted">Pick an option first.</p>`;
          return;
        }
        const chosenId = selected.value;
        const ok = QuizCore.grade(p, chosenId).correct;
        const keyId = QuizCore.correctOption(p).id;
        Progress.recordProblem(p.id, ok);
        (p.skillIds || []).forEach(skillId => Progress.recordSkillAttempt(skillId, ok, "practice:" + p.id));
        choices.forEach(ch => {
          const optionId = ch.dataset.id;
          ch.classList.remove("correct", "incorrect");
          if (optionId === keyId) ch.classList.add("correct");
          if (optionId === chosenId && !ok) ch.classList.add("incorrect");
        });
        const repairLessonId = (p.skillIds || [])
          .filter(skillId => ProgressEngine.trackForSkill(skillId) === ProgressEngine.trackForDomain(p.domain))
          .flatMap(skillId => SKILLS[skillId]?.lessonIds || [])[0];
        document.getElementById("result").innerHTML = ok
          ? `<p style="color:var(--easy);font-weight:600">Correct.</p><div class="explanation">${explanation}</div>`
          : `<p style="color:var(--hard);font-weight:600">Not quite. This skill has been scheduled for review.</p>
             <div class="explanation">${explanation}</div>
             ${repairLessonId ? `<p><a class="btn btn-secondary" href="guide.html?id=${repairLessonId}">Repair the underlying lesson</a></p>` : ""}`;
        renderRows();
      };

      document.getElementById("reveal").onclick = () => {
        const displayAnswer = QuizCore.letterFor(optionOrder, QuizCore.correctOption(p).id);
        document.getElementById("result").innerHTML = `<div class="explanation"><strong>Explanation:</strong> ${explanation}<br/><br/>Answer: <strong>${displayAnswer}</strong></div>`;
      };
    }

    trackSelect.addEventListener("change", () => {
      fillDomainAndSkillOptions(trackSelect.value, "all", "all");
      renderRows();
    });
    ["domain", "diff", "skill", "status", "q"].forEach(id => {
      document.getElementById(id).addEventListener("input", renderRows);
      document.getElementById(id).addEventListener("change", renderRows);
    });

    renderRows();
    renderPanel();
  </script>
</body>
</html>
